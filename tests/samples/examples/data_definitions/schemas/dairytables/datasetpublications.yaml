- name: datasetpublications
  type: BASE TABLE
  schema: dairy
  comment: Links DERC related datasets to publications in the literature.
  columns:
    - name: datasetid
      type: uuid7
      comment: References the uuid for the dataset metadata stored in the database.
    - name: publicationid
      type: uuid7
      comment: A pointer to the publications table.
  constraints:
  - name: datasetpublications_datasetid_fk
    comment: The foreign key referencing the datasets table in the database.
    type: REFERENCES
    ddl: FOREIGN KEY (datasetid) REFERENCES datasets(datasetid) ON UPDATE CASCADE ON DELETE CASCADE
    references:
      table: datasets
      columns:
      - datasetid
  - name: datasetpublications_publicationid_fk
    comment: The foreign key referencing the publications table in the database.
    type: REFERENCES
    ddl: FOREIGN KEY (publicationid) REFERENCES publication(publicationid) ON UPDATE CASCADE ON DELETE CASCADE
    references:
      table: publications
      columns:
      - publicationid
  - name: datasetpublications_joint_pk
    comment: The Primary Key here is the joint datasetid/publicationid key. It shouldn't be repeated.
    type: PRIMARY KEY
    ddl: PRIMARY KEY (datasetid, publicationid)
    columns:
    - publicationid
    - datasetid
