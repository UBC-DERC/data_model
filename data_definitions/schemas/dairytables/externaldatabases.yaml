- name: externaldatabases
  schema: dairy
  comment: >-
    A table to manage and record pointers to various external resources.
    These resources include data management tools such as DOIs and ARKs, product identifiers such as UPC codes, 
    and other external references such as WikiData, or others.
  type: BASE TABLE
  columns:
    - name: databaseid
      type: uuid7
      comment: A unique internal identifier for an external database reference.
    - name: externaldatabase
      type: text
      comment: The name of the external database or data resource.
    - name: url
      type: url
      comment: A web address for this resource, a primary location.
    - name: urlmask
      type: url
      comment: >-
        The url mask is intended to show how the identifers should be used. 
        The mask will be based on the resource itself. For example, ORCID indicates 
        that its identifiers should be written as `https://orcid.org/0000-0000-0000-0000`, 
        in which case the URL mask should be `{identifier}` such that replacing the 
        identifier produces a valid URL.
        Thus, for a DOI, where the DOI itself is written `10.0000/0000000`, the mask will be
        `https://doi.org/{identifier}`.
    - ref: data_definitions/schemas/dairytables/columns/datecreated.yaml
    - ref: data_definitions/schemas/dairytables/columns/datemodified.yaml
