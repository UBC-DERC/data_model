- name: instruments
  schema: dairy
  type: BASE TABLE
  comment: |
    A table for managing scientific and technical instruments used within the research system. This table is intended to help with connecting 
    measurements to documentation and workflow management. The design of this table and its associated foreign key links is based on the [RDA
    PIDINST v1.0](https://zenodo.org/records/6396467#.YkQxzRBBwlw).
  columns:
    - ref: columns/instrumentid.yaml
    - name: description
      type: text
      comment: |
        A general description for the particular instrument that can be used to easily identify the instrument. Should include a technical description of the device and its capabilities.
    - name: instrumentname
      comment: The proper name by which the instrument is identified. The instrument may have other colloquial names.
      type: text
    - name: instrumentcolloquialnames
      comment: Colloquial names used for the instrument. This field should be a text array to support multiple entries.
      type: text array
      nullable: true
    - name: manufacturerid
      comment: The manufacturer of the product.
    - name: supplierid
      comment: The organization through which the equipment was purchased.
      foreign-key:
        table: institutions
        column: institutionid
    - ref: columns/datecreated.yaml
    - ref: columns/datemodified.yaml
    - name: superceedingrecordid
      comment: In the case a record is replaced with an alternative record (for example a manufacturer is sold to a new company).
      type: UUID7
  constraints:
  - name: instrument_pkey
    comment: |
      The PRIMARY KEY for this table is a UUID7, which is unordered and globally unique. This is not the same as the UPC or serial number, and should be used only for internal reference.
    type: PRIMARY KEY
    def: PRIMARY KEY (instrumentid)
    table: instruments
    referencedTable:
    - instruments
    columns:
    - instrumentid
  - name: superceeding_fkey
    comment: In the event an instrument is re-defined somehow -- when a value is overwritten -- this hierarchical key will point to the new information.
    type: FOREIGN KEY
    def: FOREIGN KEY (superceedingrecordid) REFERENCES instruments(instrumentid) ON UPDATE CASCADE ON DELETE CASCADE
    table: instruments
    referencedTable:
    - instruments
    columns:
    - superceedingrecordid
    referencedColumns:
    - instrumentid
  - name: manufacturer_fkey
    type: FOREIGN KEY
    def: FOREIGN KEY (manufacturerid) REFERENCES institutions(institutionid) ON UPDATE CASCADE
    table: instruments
    referencedTable: institutions
    columns:
      -manufacturerid
    referencedColumns:
      - institutionid
  - name: supplier_fkey
    type: FOREIGN KEY
    def: FOREIGN KEY (supplierid) REFERENCES institutions(institutionid) ON UPDATE CASCADE
    table: instruments
    referencedTable: institutions
    columns:
      -supplierid
    referencedColumns:
      - institutionid
