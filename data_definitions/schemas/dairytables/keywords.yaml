- name: keywords
  schema: dairy
  comment: >-
    A table for keywords for datasets, publications and other terms. Ideally these terms are linked to external resources, such as ontologies or subject schema.
  type: BASE TABLE
  columns:
  - ref: data_definitions/schemas/dairytables/columns/keywordid.yaml
  - name: keyword
    type: text
    comment: A keyword used to describe a thing in the database.
  - ref: data_definitions/schemas/dairytables/columns/sourceid.yaml
  - ref: data_definitions/schemas/dairytables/columns/datecreated.yaml
  - ref: data_definitions/schemas/dairytables/columns/datemodified.yaml
  - name: superceedingrecord
    comment: In the case a record is replaced with an alternative record (for example a manufacturer is sold to a new company).
    type: UUID7
  constraints:
  - name: keywordid_pk
    comment: Primary key for the keywords table (expects to be unique)
    type: PRIMARY KEY
    ddl: PRIMARY KEY(keywordid, sourceid)
    columns:
    - keywordid
    - sourceid
  - name: keywordsource_fk
    type: FOREIGN KEY
    ddl: FOREIGN KEY (sourceid) REFERENCES externaldatabases(databaseid)
    references:
      table: externaldatabases
      columns:
        - databaseid