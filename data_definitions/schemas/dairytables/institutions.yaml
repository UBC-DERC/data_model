- name: institutions
  schema: dairy
  comment: >-
    A table for institutions and organizations. This table is modeled after the [Research Organization Registry](https://ror.org/) and is
    intended to link to collaboration institutions, manufacturers, suppliers and research or operational dairy farms.
  type: BASE TABLE
  columns:
  - ref: data_definitions/schemas/dairytables/columns/institutionid.yaml
  - ref: data_definitions/schemas/dairytables/columns/datecreated.yaml
  - ref: data_definitions/schemas/dairytables/columns/datemodified.yaml
  - name: superceedingrecord
    comment: In the case a record is replaced with an alternative record (for example a manufacturer is sold to a new company).
    type: UUID7
  constraints:
  - name: institutionid_pk
    comment: Primary key for the institutions table (expects to be unique)
    type: PRIMARY KEY
    ddl: PRIMARY KEY(institutionid)
    columns:
    - institutionid
  - name: institution_superceeding_fk
    type: REFERENCES
    comment: Allows for institutions to be renamed, or get switched over time.
    columns:
      - superceedingrecord
    references:
      table: institutions
      columns: 
        - institutionid
    ddl: FOREIGN KEY (superceedingrecord) REFERENCES institutions(institutionid)