[project]
name = "data-model"
version = "0.1.0"
description = "Manage YAML representations of PostgreSQL database definitions, including tables, schema, indices and constraints."
readme = {file="README.md", content-type = "text/markdown"}
authors = [
    { name = "Simon Goring", email = "simon.goring@ubc.ca" }
]
maintainers = [
    { name = "Simon Goring", email = "simon.goring@ubc.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.10.2",
    "mkdocs>=1.6.1",
    "mkdocs-include-dir-to-nav>=1.2.0",
    "mkdocs-material>=9.7.6",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "py-markdown-table>=1.3.0",
    "pyyaml>=6.0.3",
]
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["data model", "database", "postgres", "data governance", "documentation"]
classifiers=[
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: MkDocs",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation"]

[project.urls]
repository="https://github.com/UBC-DERC/data_model"
homepage="https://UBC-DERC.github.io/data_model"
issues="https://github.com/UBC-DERC/data_model/issues"

[project.scripts]
data-model = "data_model:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
