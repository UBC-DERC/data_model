[project]
name = "data-model"
version = "0.1.0"
description = "Manage YAML representations of PostgreSQL database definitions, including tables, schema, indices and constraints."
readme = {file="README.md", content-type = "text/markdown"}
authors = [
    { name = "Simon Goring", email = "simon.goring@ubc.ca" }
]
maintainers = [
    { name = "Simon Goring", email = "simon.goring@ubc.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "py-markdown-table>=1.3.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["data model", "database", "postgres", "data governance", "documentation"]
classifiers=[
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: MkDocs",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation"]

[project.urls]
repository="https://github.com/UBC-DERC/data_model"
homepage="https://UBC-DERC.github.io/data_model"
issues="https://github.com/UBC-DERC/data_model/issues"

[project.scripts]
data-model = "data_model:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-include-dir-to-nav>=1.2.0",
    "mkdocs-material>=9.7.6",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=0.26.0",
    "markdown>=3.10.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6.0",
    "pytest-datafiles>=3.0.1",
    "ty>=0.0.61",
    "mkdocs-material>=9.7.6",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-include-dir-to-nav>=1.2.0",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs[i18n]>=1.6.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=data_model --cov-report markdown:docs/api/coverage.md --cov-fail-under=70"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.rules]
all="warn"
