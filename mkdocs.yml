site_name: DERC Data Modelling
repo_url: https://github.com/UBC-DERC/data_model/
site_description: |
  Documentation and guidance for the DERC Dairy Database, including technical build information,
  data model sources and inspirations, and guidance on modifying the model, proposing new data structures
  and using the system to build new databases.
site_author: Simon Goring
copyright: '2026'
site_url: https://ubc-derc.github.io/data_model/
nav:
  - Introduction: 'index.md'
  - Governance and Guidance: 'admin/governance.md'
  - Project Summary: 'summary/executive_summary.md'
  - Database:
    - database/dairy
    - database/apps

theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    - navigation.prune
    - navigation.path
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
extra_css:
  - stylesheets/extra.css
plugins:
  - mermaid2
  - include_dir_to_nav
  - search:
      lang: en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
        # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: UBC-DERC
      repo: data_model
