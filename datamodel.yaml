- Instrument:
  columns:
    - Identifier 	M 	1 	Unique string that identifies the instrument instance 	 
      - identifierType 	M 	1 	Type of the identifier 	[1]
    - SchemaVersion 	M 	1 	Version number of the PIDINST schema used in this record 	Fixed value [2]
    - LandingPage 	M 	1 	A landing page that the identifier resolves to 	URL
    - Name 	M 	1 	Name by which the instrument instance is known 	Free text
    - Owner 	M 	1-n 	Institution(s) responsible for the management of the instrument. This may include the legal owner, the operator, or an institute providing access to the instrument. 	 
      - ownerName 	M 	1 	Full name of the owner 	Free text
      - ownerContact 	O 	0-1 	Contact address of the owner 	Electronic mail address
      - ownerIdentifier 	O 	0-1 	Identifier used to identify the owner 	Free text, should be a globally unique identifier.
      - ownerIdentifierType 	O 	1 	Type of the identifier 	Free text
    - Manufacturer 	M 	1-n 	The instrument's manufacturer(s) or developer. This may also be the owner for custom build instruments 	 
      - manufacturerName 	M 	1 	Full name of the manufacturer 	Free text
      - manufacturerIdentifier 	O 	0-1 	Identifier used to identify the manufacturer 	Free text, should be a globally unique identifier.
      - manufacturerIdentifierType 	O 	1 	Type of the identifier 	Free text
    - Model 	R 	0-1 	Name of the model or type of device as attributed by the manufacturer 	 
      - modelName 	R 	1 	Full name of the model 	Free text
      - modelIdentifier 	O 	0-1 	Identifier used to identify the model 	Free text, should be a globally unique identifier.
      - modelIdentifierType 	O 	1 	Type of the identifier 	Free text
    - Description 	R 	0-1 	Technical description of the device and its capabilities 	Free text
    - InstrumentType 	R 	0-n 	Classification of the type of the instrument 	 
      - instrumentTypeName 	R 	1 	Full name of the instrument type 	Free text
      - instrumentTypeIdentifier 	O 	0-1 	Identifier used to identify the type of the instrument 	Free text, should be a globally unique identifier
      - instrumentTypeIdentifierType 	O 	1 	Type of the identifier 	Free text
    - MeasuredVariable 	R 	0-n 	The variable(s) that this instrument measures or observes 	Free text
    - Date 	R 	0-n 	Dates relevant to the instrument 	ISO 8601
      - dateType 	R 	1 	The type of the date 	

Controlled list of values:

    Commissioned, DeCommissioned

12 	RelatedIdentifier 	R 	0-n 	Identifiers of related resources 	Free text, must be globally unique identifiers.
12.1 	relatedIdentifierType 	R 	1 	Type of the identifier 	

Controlled list of values:

    ARK, arXiv, bibcode, DOI, EAN13, EISSN, Handle, IGSN, ISBN, ISSN, ISTC, LISSN, PMID, PURL, RAiD, RRID, UPC, URL, URN, w3id

12.2 	relationType 	R 	1 	Description of the relationship 	

Controlled list of values:

    IsDescribedBy, IsNewVersionOf, IsPreviousVersionOf, HasComponent, IsComponentOf, References, HasMetadata, WasUsedIn, IsIdenticalTo, IsAttachedTo

12.3 	relatedIdentifierName 	O 	0-1 	A name for the related resource, may be used to give a hint on the content of that resource 	Free text
13 	AlternateIdentifier 	R 	0-n 	Identifiers other than the PIDINST pertaining to the same instrument instance. This should be used if the instrument has a serial number. Other possible uses include an owner's inventory number or an entry in some instrument data base. 	Free text, should be unique identifiers
13.1 	alternateIdentifierType 	R 	1 	Type of the identifier 	

Controlled list of values:

    SerialNumber, InventoryNumber, Other

13.2 	alternateIdentifierName 	O 	0-1 	A supplementary name for the identifier type. This is mostly useful if alternateIdentifierType is Other. 	Free text
