name: ci
on:
  push:
    branches:
      - main
      - develop
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Runs on every push to main/develop and on pull requests.
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout the repository.
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Check ty
        run: uv run ty check --output-format=github
      - name: Tests (pytest)
        run: uv run pytest -q
      - name: Generate JSON Schema
        run: uv run python -c "import json; from data_model.object_classes import ddaml_dict; print(json.dumps(ddaml_dict.model_json_schema(), indent=2))" > docs/schema.json
      - name: Docs build (strict)
        run: uv run mkdocs build --strict

  # Deploys the docs to GitHub Pages, but only on main and only after the
  # checks job has passed.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout the repository.
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - run: uv sync --frozen
      - name: Generate JSON Schema
        run: uv run python -c "import json; from data_model.object_classes import ddaml_dict; print(json.dumps(ddaml_dict.model_json_schema(), indent=2))" > docs/schema.json
      - name: Build static files
        id: build
        run: uv run mkdocs build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb # v5.0.0
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
